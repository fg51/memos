[project]
name = "study-pytorch"
version = "0.1.0"
description = "Add your description here"
dependencies = [
"torchviz>=0.0.2",
"numpy>=1.24.4",
"matplotlib>=3.7.4",
"torchinfo>=1.8.0",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[[tool.rye.sources]]
name = "torch"
url = "https://download.pytorch.org/whl/cpu"
type = "index"

[tool.hatch.metadata]
allow-direct-references = true
